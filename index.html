<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
  <title>Angel & Fitra | Check-in</title>
</head>
<body>
  <header><h1>Angel & Fitra</h1><p>Portal verifikasi tamu</p><div id="status">Belum memuat data</div></header>
  <main>
    <section class="search"><label for="query">Cari nama keluarga atau kode QR</label><div class="row"><input id="query" autocomplete="off" placeholder="Ketik nama atau AF-TEST-001"><button id="scan">Scan QR</button></div><video id="video" playsinline hidden></video><div id="results"></div></section>
    <section id="detail" hidden></section>
    <section class="actions"><button id="refresh">Muat data tamu</button><button id="sync">Sinkronkan</button></section>
    <p id="message" aria-live="polite"></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
